name: SyncFlow CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: syncflow-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-checks:
    name: Repository Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check whitespace errors
        run: git diff --check

      - name: Validate repository structure
        run: |
          test -d backend
          test -d frontend
          test -d automation
          test -d docs
          test -f README.md

  backend-ci:
    name: PHP / Symfony CI
    runs-on: ubuntu-latest
    if: ${{ hashFiles('backend/composer.json') != '' }}

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathai/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, intl, pdo_pgsql, zip, redis
          coverage: none
          tools: composer:v2

      - name: Validate Composer configuration
        run: composer validate --no-check-publish

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Check PHP syntax
        run: |
          if [ -d src ]; then
            find src -type f -name "*.php" -print0 | xargs -0 -r -n1 php -l
          fi

      - name: Run PHPUnit tests
        run: |
          if [ -x vendor/bin/phpunit ]; then
            vendor/bin/phpunit
          else
            echo "PHPUnit is not configured yet. Skipping tests."
          fi

      - name: Run PHPStan
        run: |
          if [ -x vendor/bin/phpstan ]; then
            vendor/bin/phpstan analyse
          else
            echo "PHPStan is not configured yet. Skipping static analysis."
          fi

  frontend-ci:
    name: React / TypeScript CI
    runs-on: ubuntu-latest
    if: ${{ hashFiles('frontend/package-lock.json') != '' }}

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: |
          if npm run | grep -qE '^[[:space:]]+lint'; then
            npm run lint
          else
            echo "Lint script not configured yet. Skipping."
          fi

      - name: Build frontend
        run: |
          if npm run | grep -qE '^[[:space:]]+build'; then
            npm run build
          else
            echo "Build script not configured yet. Skipping."
          fi

  docker-validation:
    name: Docker Compose Validation
    runs-on: ubuntu-latest
    if: ${{ hashFiles('docker-compose.yml') != '' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Docker Compose
        run: docker compose -f docker-compose.yml config --quiet
